<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencilcase: practice quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFEEF4;--ink:#4A1F3A;--accent:#C2255C;--mark:#FFD0E1;--good:#CFF3DD;--ok:#1B7F52;--bad:#C92A2A;--card:#FFFFFF;--soft:#7A5468;--line:#F7D3E1}
*{box-sizing:border-box}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.5;
background:var(--paper)}
#app{max-width:760px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.05}
h2{font-size:1.25rem;margin:0 0 4px}
p{margin:0}
.lead{color:var(--soft);margin-top:8px;max-width:46ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
.btn{font:inherit;font-weight:600;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;display:inline-block}
.btn:hover{background:var(--mark)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.main:hover{background:#9E1B49;border-color:#9E1B49}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.decks{display:grid;gap:18px}
.deck,.card{background:var(--card);border:2px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);padding:18px 20px}
.deck .meta{color:var(--soft);font-size:.95rem;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.best{background:var(--mark);padding:0 6px;border-radius:3px;font-weight:600;color:var(--ink)}
.empty{padding:28px;border:2px dashed var(--ink);border-radius:10px;background:var(--card)}
.progress{height:10px;border:2px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{color:var(--soft);font-size:.9rem;display:flex;justify-content:space-between;margin-bottom:20px}
.card{min-height:170px;display:flex;flex-direction:column;justify-content:center;margin-bottom:20px;font-size:1.35rem;font-weight:600}
.card small{display:block;font-size:.8rem;color:var(--soft);font-weight:400;margin-bottom:6px}
.card .ans{margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
.card .ans span{background:var(--good);padding:0 6px}
.opts{display:grid;gap:10px;margin-bottom:20px}
.opt{text-align:left;font:inherit;font-weight:600;background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.opt:hover:not([disabled]){background:var(--mark)}
.opt.right{background:var(--good);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad);color:var(--soft)}
.opt[disabled]{cursor:default}
input[type=text],textarea{width:100%;font:inherit;border:2px solid var(--ink);border-radius:8px;padding:11px 12px;background:var(--card);color:var(--ink)}
textarea{min-height:260px;resize:vertical;line-height:1.6}
label.f{display:block;font-weight:600;margin:16px 0 6px}
.hint{color:var(--soft);font-size:.9rem;margin-top:6px}
.fb{font-weight:600;margin-bottom:16px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.score{font-size:clamp(3.5rem,14vw,6rem);font-weight:800;line-height:1;margin:10px 0}
.score span{background:var(--mark);padding:0 10px;border-radius:4px}
.missed{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:10px}
.missed li{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:10px 14px}
.missed li b{display:block}
#notes{min-height:130px}
.crow{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:10px}
.crow .num{color:var(--soft);font-weight:600;text-align:center}
.crow .x{font:inherit;font-size:1.3rem;line-height:1;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;height:42px;cursor:pointer}
.crow .x:hover{background:var(--mark)}
@media (max-width:600px){.crow{grid-template-columns:24px 1fr 38px}.crow .a{grid-column:2}}
.types{display:grid;gap:14px;margin-top:22px}
.type{font:inherit;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:14px 18px;cursor:pointer}
.type b{display:block;font-size:1.15rem}
.type span{color:var(--soft)}
.type:hover:not([disabled]){background:var(--mark)}
.type:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.type[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.opts.two{grid-template-columns:1fr 1fr}
.back{background:none;border:0;font:inherit;color:var(--soft);cursor:pointer;padding:0;margin-bottom:18px;text-decoration:underline}
@media (max-width:480px){#app{padding:20px 14px 48px}.card{font-size:1.15rem}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY = "pencilcase.decks.v1";
const app = document.getElementById("app");

function uid(){ return Math.random().toString(36).slice(2, 9); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/[^\p{L}\p{N}=<>\s.]/gu,"").replace(/\s+/g," ").trim(); }

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(d)) return d; }catch(e){}
  return [];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(decks)); }catch(e){} }

let decks = load();
let view = {name:"home"};
let session = null;

function render(){
  ({home, edit, play, done, choose})[view.name]();
  window.scrollTo(0,0);
  const a = document.getElementById("ans"); if(a) a.focus();
}

/* ---------- Home ---------- */
function home(){
  app.innerHTML = `
    <h1>Pencilcase</h1>
    <p class="lead">Make a deck of questions, then pick how you want to practice.</p>
    <div class="bar">
      <button class="btn main" data-act="new">New deck</button>
      <label class="btn">Import deck<input type="file" id="imp" accept=".json,application/json" hidden></label>
    </div>
    ${decks.length ? `<div class="decks">${decks.map(d=>`
      <article class="deck">
        <h2>${esc(d.title)}</h2>
        <p class="meta">${d.cards.length} card${d.cards.length===1?"":"s"}${d.best!=null?` &nbsp;Best score: <span class="best">${d.best}%</span>`:""}</p>
        <div class="row">
          <button class="btn main" data-act="choose" data-id="${d.id}" ${d.cards.length<1?"disabled":""}>Practice</button>
          <button class="btn" data-act="edit" data-id="${d.id}">Edit</button>
        </div>
      </article>`).join("")}</div>`
    : `<div class="empty"><h2>No decks yet</h2><p>Select New deck to write your own questions or paste your notes.</p></div>`}`;
  document.getElementById("imp").onchange = importDeck;
}

/* ---------- Edit ---------- */
function choose(){
  const d=decks.find(x=>x.id===view.id), n=d.cards.length;
  const types=[
    ["quiz","Multiple choice","Pick the right answer from up to four choices.",2],
    ["tf","True or false","Decide if the answer shown matches the question.",2],
    ["type","Identification","Type the answer from memory.",1],
    ["flash","Flashcards","Flip each card, then say if you knew it.",1],
    ["mix","Mixed","Multiple choice, true or false, and identification together.",2]
  ];
  app.innerHTML=`<button class="back" data-act="home">Back to decks</button>
    <h1>Choose a quiz type</h1>
    <p class="lead">${esc(d.title)}, ${n} card${n===1?"":"s"}</p>
    <div class="types">${types.map(([m,t,desc,min])=>`<button class="type" data-act="play" data-id="${d.id}" data-mode="${m}" ${n<min?"disabled":""}><b>${t}</b><span>${desc}${n<min?" Needs at least "+min+" cards.":""}</span></button>`).join("")}</div>`;
}
const STOP=new Set(["which","their","there","these","those","about","would","could","should","because","between","through","other","where","while","being","after","before","every","often","using"]);
function cloze(sentence){
  const words=sentence.split(/\s+/);
  if(words.length<5) return null;
  let best=null;
  words.forEach((w,i)=>{
    const c=w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"");
    if(c.length<5||STOP.has(c.toLowerCase())) return;
    const score=c.length+(i>0&&/^\p{Lu}/u.test(c)?4:0)+(/\d/.test(c)?3:0);
    if(!best||score>best.score) best={c,score};
  });
  if(!best) return null;
  return {q:"Fill in the blank: "+sentence.replace(best.c,"_____"),a:best.c};
}
function notesToCards(text){
  const out=[], seen=new Set();
  const add=(q,a)=>{ q=q.trim(); a=a.trim(); if(!q||!a||seen.has(q)) return; seen.add(q); out.push({q,a}); };
  const lines=text.split(/\n+/).map(l=>l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/,"").trim()).filter(Boolean);
  for(let i=0;i<lines.length&&out.length<100;i++){
    const line=lines[i]; let m;
    if((m=line.match(/^(.+?)\s*\|\s*(.+)$/))){ add(m[1],m[2]); continue; }
    if(line.endsWith("?")&&i+1<lines.length&&!lines[i+1].endsWith("?")){ add(line,lines[i+1]); i++; continue; }
    if((m=line.match(/^(.+?\?)\s+(\S.*)$/))){ add(m[1],m[2]); continue; }
    if((m=line.match(/^([^:=]{2,50}?)\s*(?::|=|\s[-–—]\s)\s*(\S.{2,})$/))&&m[1].split(/\s+/).length<=6){ add("What is "+m[1]+"?",m[2]); continue; }
    line.split(/(?<=[.!?])\s+(?=\p{Lu})/u).forEach(sn=>{ const c=cloze(sn); if(c) add(c.q,c.a); });
  }
  return out;
}
function fromNotes(){
  const ta=document.getElementById("notes"), info=document.getElementById("info");
  const cards=notesToCards(ta.value);
  document.getElementById("msg").textContent="";
  if(!cards.length){
    info.className="fb no";
    info.textContent="No cards found. Try lines like “Term: meaning” or “Question? Answer”, or paste full sentences.";
    return;
  }
  const rows=document.getElementById("rows");
  [...rows.children].forEach(r=>{ if(!r.querySelector(".q").value.trim()&&!r.querySelector(".a").value.trim()) r.remove(); });
  const start=rows.children.length;
  cards.forEach(c=>rows.insertAdjacentHTML("beforeend",rowHtml(c,0)));
  renum(); ta.value="";
  info.className="fb ok";
  info.textContent="Added "+cards.length+" card"+(cards.length===1?"":"s")+". Check them below, fix anything that looks off, then save.";
  rows.children[start].scrollIntoView({behavior:"smooth",block:"center"});
}
function rowHtml(c,i){
  return `<div class="crow"><span class="num">${i+1}</span>
    <input type="text" class="q" placeholder="Question" aria-label="Question" value="${esc(c.q)}">
    <input type="text" class="a" placeholder="Answer" aria-label="Answer" value="${esc(c.a)}">
    <button class="x" data-act="delrow" aria-label="Remove this card">×</button></div>`;
}
function addRow(){
  const rows=document.getElementById("rows");
  rows.insertAdjacentHTML("beforeend",rowHtml({q:"",a:""},rows.children.length));
  rows.lastElementChild.querySelector(".q").focus();
}
function renum(){ document.querySelectorAll(".crow .num").forEach((n,i)=>n.textContent=i+1); }
function edit(){
  const d = view.id ? decks.find(x=>x.id===view.id) : {title:"",cards:[]};
  const rows = d.cards.length ? d.cards : [{q:"",a:""},{q:"",a:""},{q:"",a:""}];
  app.innerHTML = `
    <button class="back" data-act="home">Back to decks</button>
    <h1>${view.id?"Edit deck":"New deck"}</h1>
    <label class="f" for="title">Deck name</label>
    <input type="text" id="title" value="${esc(d.title)}" placeholder="Example: Networking midterm">
    <label class="f" for="notes">Paste your notes (optional)</label>
    <textarea id="notes" placeholder="Paste class notes here. Lines like “Term: meaning” or “Question? Answer” become cards."></textarea>
    <div class="bar" style="margin:10px 0 4px"><button class="btn" data-act="fromnotes">Turn notes into cards</button></div>
    <p class="hint">Other sentences become fill-in-the-blank cards. You can review and edit everything before saving.</p>
    <p class="fb ok" id="info" role="status"></p>
    <label class="f">Cards</label>
    <div id="rows">${rows.map(rowHtml).join("")}</div>
    <button class="btn" data-act="addrow">Add card</button>
    <p class="hint">Tip: press Enter in an answer box to start the next card.</p>
    <p class="fb no" id="msg" role="alert"></p>
    <div class="bar">
      <button class="btn main" data-act="save">Save deck</button>
      ${view.id?`<button class="btn" data-act="export">Export to share</button><button class="btn danger" data-act="delete">Delete deck</button>`:""}
    </div>`;
}
function saveDeck(){
  const title=document.getElementById("title").value.trim();
  const msg=document.getElementById("msg");
  const cards=[];
  const rows=[...document.querySelectorAll(".crow")];
  for(let i=0;i<rows.length;i++){
    const q=rows[i].querySelector(".q").value.trim(), a=rows[i].querySelector(".a").value.trim();
    if(!q&&!a) continue;
    if(!q||!a){ msg.textContent="Card "+(i+1)+" needs both a question and an answer."; return; }
    cards.push({q,a});
  }
  if(!title){ msg.textContent="Give your deck a name first."; return; }
  if(!cards.length){ msg.textContent="Add at least one card with a question and an answer."; return; }
  if(view.id){ const d=decks.find(x=>x.id===view.id); d.title=title; d.cards=cards; d.best=null; }
  else decks.push({id:uid(),title,cards,best:null});
  save(); view={name:"home"}; render();
}
function exportDeck(){
  const d=decks.find(x=>x.id===view.id);
  const blob=new Blob([JSON.stringify({title:d.title,cards:d.cards},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=d.title.replace(/[^\w-]+/g,"_")+".json"; a.click(); URL.revokeObjectURL(a.href);
}
function importDeck(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      const cards=(o.cards||[]).filter(c=>c&&c.q&&c.a).map(c=>({q:String(c.q),a:String(c.a)}));
      if(!o.title||!cards.length) throw new Error();
      decks.push({id:uid(),title:String(o.title),cards,best:null}); save(); render();
    }catch(err){ alert("That file isn’t a Pencilcase deck. Use a .json file exported from this app."); }
  };
  r.readAsText(f);
}

/* ---------- Practice ---------- */
function start(id,mode,subset){
  const d=decks.find(x=>x.id===id);
  const pool=subset||d.cards;
  session={id,mode,pool,cards:shuffle(pool.slice()),i:0,res:[],state:"ask",opts:null,pick:null,fb:null};
  prep(); view={name:"play"}; render();
}
function prep(){
  const s=session, c=s.cards[s.i], d=decks.find(x=>x.id===s.id);
  const others=[...new Set(d.cards.map(x=>x.a).filter(a=>a!==c.a))];
  s.kind = s.mode==="mix" ? ["quiz","tf","type"][Math.floor(Math.random()*3)] : s.mode;
  if(s.kind==="quiz"&&!others.length) s.kind="type";
  if(s.kind==="quiz") s.opts=shuffle([c.a,...shuffle(others).slice(0,3)]);
  if(s.kind==="tf"){
    const truth=!others.length||Math.random()<.5;
    s.tf={truth,shown:truth?c.a:others[Math.floor(Math.random()*others.length)]};
  }
}
function play(){
  const s=session, c=s.cards[s.i], n=s.cards.length;
  const k=s.kind;
  const label={flash:"Flashcards",quiz:"Multiple choice",tf:"True or false",type:"Identification"}[k];
  let body="";
  if(k==="flash"){
    body = `<div class="card"><small>Question</small>${esc(c.q)}${s.state==="shown"?`<div class="ans"><small>Answer</small><span>${esc(c.a)}</span></div>`:""}</div>
      <div class="row">${s.state==="ask"
        ? `<button class="btn main" data-act="reveal" data-enter>Show answer</button>`
        : `<button class="btn main" data-act="mark" data-ok="1" data-enter>I knew it</button><button class="btn" data-act="mark" data-ok="0">Still learning</button>`}</div>`;
  } else if(k==="tf"){
    const done=s.state==="done";
    let note="";
    if(done){
      note=s.fb?"Correct.":"Not quite.";
      if(!s.tf.truth) note+=" The real answer is: "+esc(c.a)+".";
      else if(!s.fb) note+=" That answer was correct.";
    }
    body = `<div class="card"><small>Question</small>${esc(c.q)}<div class="ans"><small>Proposed answer</small>${esc(s.tf.shown)}</div></div>
      <div class="opts two">${["True","False"].map((l,i)=>{ const right=(i===0)===s.tf.truth; return `<button class="opt ${done?(right?"right":(i===s.pick?"wrong":"")):""}" data-act="tf" data-i="${i}" ${done?"disabled":""}>${i+1}. ${l}</button>`; }).join("")}</div>
      ${done?`<p class="fb ${s.fb?"ok":"no"}">${note}</p><button class="btn main" data-act="next" data-enter>${s.i+1<n?"Next question":"See results"}</button>`:""}`;
  } else if(k==="quiz"){
    const done=s.state==="done";
    body = `<div class="card"><small>Question</small>${esc(c.q)}</div>
      <div class="opts">${s.opts.map((o,i)=>`<button class="opt ${done?(o===c.a?"right":(i===s.pick?"wrong":"")):""}" data-act="pick" data-i="${i}" ${done?"disabled":""}>${i+1}. ${esc(o)}</button>`).join("")}</div>
      ${done?`<p class="fb ${s.fb?"ok":"no"}">${s.fb?"Correct.":"Not quite. The answer is highlighted."}</p><button class="btn main" data-act="next" data-enter>${s.i+1<n?"Next question":"See results"}</button>`:""}`;
  } else {
    const done=s.state==="done";
    body = `<div class="card"><small>Question</small>${esc(c.q)}</div>
      ${done
        ? `<p class="fb ${s.fb?"ok":"no"}">${s.fb?"Correct.":"Not quite. The answer is: "+esc(c.a)}</p><button class="btn main" data-act="next" data-enter>${s.i+1<n?"Next question":"See results"}</button>`
        : `<label class="f" for="ans">Your answer</label><input type="text" id="ans" autocomplete="off"><div class="bar"><button class="btn main" data-act="check" data-enter>Check answer</button></div>`}`;
  }
  app.innerHTML = `
    <button class="back" data-act="home">Quit practice</button>
    <div class="progress" aria-hidden="true"><i style="width:${Math.round(s.i/n*100)}%"></i></div>
    <div class="count"><span>${label}</span><span>Card ${s.i+1} of ${n}</span></div>
    ${body}`;
}
function record(ok){ session.res.push({c:session.cards[session.i],ok}); }
function next(){
  const s=session; s.i++;
  if(s.i>=s.cards.length) return finish();
  s.state="ask"; s.pick=null; s.fb=null; prep(); render();
}
function finish(){
  const s=session, right=s.res.filter(r=>r.ok).length;
  const pct=Math.round(right/s.res.length*100);
  const d=decks.find(x=>x.id===s.id);
  if(d && s.pool===d.cards && (d.best==null||pct>d.best)){ d.best=pct; save(); }
  view={name:"done"}; render();
}
function done(){
  const s=session, right=s.res.filter(r=>r.ok).length, pct=Math.round(right/s.res.length*100);
  const missed=s.res.filter(r=>!r.ok).map(r=>r.c);
  const msg = pct===100?"Perfect run." : pct>=70?"Solid. A few to revisit." : "Keep going. Retry the missed cards below.";
  app.innerHTML = `
    <h1>Results</h1>
    <div class="score"><span>${pct}%</span></div>
    <p class="lead">${right} of ${s.res.length} correct. ${msg}</p>
    <div class="bar">
      ${missed.length?`<button class="btn main" data-act="retry">Retry ${missed.length} missed</button>`:""}
      <button class="btn ${missed.length?"":"main"}" data-act="again">Practice the full deck again</button>
      <button class="btn" data-act="choose" data-id="${s.id}">Try another quiz type</button>
      <button class="btn" data-act="home">Back to decks</button>
    </div>
    ${missed.length?`<h2>Missed cards</h2><ul class="missed">${missed.map(c=>`<li><b>${esc(c.q)}</b>${esc(c.a)}</li>`).join("")}</ul>`:""}`;
  session.missed=missed;
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, s=session;
  if(act==="home"){ view={name:"home"}; render(); }
  else if(act==="new"){ view={name:"edit",id:null}; render(); }
  else if(act==="edit"){ view={name:"edit",id:t.dataset.id}; render(); }
  else if(act==="addrow") addRow();
  else if(act==="fromnotes") fromNotes();
  else if(act==="delrow"){ t.closest(".crow").remove(); renum(); }
  else if(act==="save") saveDeck();
  else if(act==="export") exportDeck();
  else if(act==="delete"){ if(confirm("Delete this deck? This can’t be undone.")){ decks=decks.filter(x=>x.id!==view.id); save(); view={name:"home"}; render(); } }
  else if(act==="choose"){ view={name:"choose",id:t.dataset.id}; render(); }
  else if(act==="play") start(t.dataset.id,t.dataset.mode);
  else if(act==="tf"){ const i=+t.dataset.i; s.pick=i; s.fb=((i===0)===s.tf.truth); s.state="done"; record(s.fb); render(); }
  else if(act==="reveal"){ s.state="shown"; render(); }
  else if(act==="mark"){ record(t.dataset.ok==="1"); next(); }
  else if(act==="pick"){ const i=+t.dataset.i; s.pick=i; s.fb=s.opts[i]===s.cards[s.i].a; s.state="done"; record(s.fb); render(); }
  else if(act==="check"){ const v=document.getElementById("ans").value; s.fb=norm(v)===norm(s.cards[s.i].a); s.state="done"; record(s.fb); render(); }
  else if(act==="next") next();
  else if(act==="again") start(s.id,s.mode);
  else if(act==="retry") start(s.id,s.mode,s.missed);
});
document.addEventListener("keydown",e=>{
  if(view.name==="edit"&&e.key==="Enter"&&e.target.classList.contains("a")){
    e.preventDefault();
    const rows=[...document.querySelectorAll(".crow")], i=rows.indexOf(e.target.closest(".crow"));
    if(i===rows.length-1) addRow(); else rows[i+1].querySelector(".q").focus();
    return;
  }
  if(view.name!=="play") return;
  if((session.kind==="quiz"||session.kind==="tf")&&session.state==="ask"&&/^[1-4]$/.test(e.key)){
    const b=document.querySelectorAll(".opt")[+e.key-1]; if(b) b.click(); return;
  }
  if(e.key!=="Enter"||e.target.tagName==="BUTTON") return;
  const b=document.querySelector("[data-enter]"); if(b){ e.preventDefault(); b.click(); }
});

render();
</script>
</body>
</html>
